name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Axioms of the main theorems
        run: lake env lean scripts/Axioms.lean
      - name: No sorry
        run: "! grep -rn 'sorry' QuantumGravity"
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q python/tests
